name: Windows build
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile Windows package builder
        shell: pwsh
        run: ./tools/install-from-original.ps1 -ValidateOnly
      - name: Install build tool
        run: python -m pip install pyinstaller==6.16.0
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name EldenRingPresets --paths . app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: EldenRingPresets-Windows-test-build
          path: dist/EldenRingPresets.exe
          if-no-files-found: error
