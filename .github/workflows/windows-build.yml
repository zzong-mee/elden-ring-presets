name: Windows build
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths-ignore: ['downloads/**', 'docs/**', 'README.md']
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build and controller dependencies
        run: python -m pip install pyinstaller==6.16.0 pygame-ce==2.5.6
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile Windows package builder
        shell: pwsh
        run: ./tools/install-from-original.ps1 -ValidateOnly
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name EldenRingPresets --paths . app/main.py
      - name: Verify executable opens its application window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = @(Get-Process -Name EldenRingPresets -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
          $started = Start-Process -FilePath (Resolve-Path 'dist/EldenRingPresets.exe') -PassThru
          $opened = $false
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $windows = @(Get-Process -Name EldenRingPresets -ErrorAction SilentlyContinue |
                Where-Object { $existing -notcontains $_.Id -and $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -like 'Elden Ring Presets*' })
              if ($windows.Count -gt 0) { $opened = $true; break }
              $started.Refresh()
              if ($started.HasExited) { throw "Application exited before opening its window: $($started.ExitCode)" }
            }
            if (-not $opened) { throw 'Application window did not open within 30 seconds.' }
            Start-Sleep -Seconds 1
            $logRoot = Join-Path $env:LOCALAPPDATA 'EldenRingPresets'
            $startupError = Join-Path $logRoot 'startup-error.txt'
            if (Test-Path $startupError) { throw (Get-Content $startupError -Raw) }
            $appLog = Join-Path $logRoot 'app.log'
            if ((Test-Path $appLog) -and (Select-String -Path $appLog -Pattern 'Application startup failed|Controller initialization failed|Controller polling failed' -Quiet)) {
              throw (Get-Content $appLog -Raw)
            }
            Write-Host 'Application window opened successfully; no game was running or modified.'
          } finally {
            Get-Process -Name EldenRingPresets -ErrorAction SilentlyContinue |
              Where-Object { $existing -notcontains $_.Id } |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }
      - name: Record build information
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $info = [ordered]@{
            source_commit = $env:SOURCE_SHA
            target_game_version = '1.17.1'
            build_type = 'test'
            windows_gui_smoke_test = 'passed'
            game_equipment_changes_verified = $false
            exe_sha256 = (Get-FileHash dist/EldenRingPresets.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $info | ConvertTo-Json | Set-Content dist/BUILD-INFO.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: EldenRingPresets-Windows-test-build
          path: |
            dist/EldenRingPresets.exe
            dist/BUILD-INFO.json
          if-no-files-found: error
  publish-download:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: EldenRingPresets-Windows-test-build
          path: compiled
      - name: Commit tested executable to downloads
        env:
          SOURCE_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo 'Branch advanced during build; leaving its download files unchanged.'
            exit 0
          fi
          mkdir -p downloads
          cp compiled/EldenRingPresets.exe downloads/EldenRingPresets-Test.exe
          cp compiled/BUILD-INFO.json downloads/BUILD-INFO.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/EldenRingPresets-Test.exe downloads/BUILD-INFO.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Windows test executable and build verification metadata'
          git push origin "HEAD:$TARGET_BRANCH"
